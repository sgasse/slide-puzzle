[package]
name = "slide-puzzle"
version = "0.3.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "^0.1.7", optional = true }
fnv = "1.0.7"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
log = "0.4.34"
rand = "0.10.3"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
wasm-bindgen = "0.2.129"
wasm-logger = "0.2.0"
web-sys = { version = "0.3.106", features = [
    "CssRule",
    "CssRuleList",
    "CssStyleDeclaration",
    "CssStyleSheet",
    "Document",
    "Element",
    "HtmlCollection",
    "HtmlDivElement",
    "Location",
    "MouseEvent",
    "StyleSheet",
    "StyleSheetList",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Window",
] }

[dev-dependencies]
criterion = "0.8.2"
lazy_static = "1.5.0"

[features]
default = ["console_error_panic_hook"]

[[bench]]
name = "solver_benchmark"
harness = false
